name: Build Android app

on:
  workflow_dispatch:      # lets you press a "Run workflow" button
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write      # lets the build publish a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read the version number
        id: ver
        working-directory: android
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::Mostafa MultiWidget $VER"
          echo "## Mostafa MultiWidget $VER" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the app (version ${{ steps.ver.outputs.version }})
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the app file
        working-directory: android
        run: cp app/build/outputs/apk/debug/*.apk "Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}.apk"

      - name: Keep the app (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}
          path: android/Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}.apk

      - name: Fetch the newest Windows installer (it is published beside the app)
        continue-on-error: true      # no Windows release yet: the Android release still goes out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("win-v")) | .tagName][0] // empty')
          if [ -z "$TAG" ]; then
            echo "::warning::No Windows release (tag win-v...) exists yet, so only the app is published."
            exit 0
          fi
          mkdir -p windows
          gh release download "$TAG" --pattern "*Setup.exe" --dir windows
          mv windows/*Setup.exe "windows/Mostafa-MultiWidget-Windows-v${{ steps.ver.outputs.version }}.exe"
          echo "Windows program ${TAG#win-v} is published as Mostafa-MultiWidget-Windows-v${{ steps.ver.outputs.version }}.exe"

      - name: Publish a Release (the app's "check for updates" reads it)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mostafa MultiWidget ${{ steps.ver.outputs.version }}
          body_path: android/release-notes.md   # the changes, written in the Release
          files: |
            android/Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}.apk
            windows/Mostafa-MultiWidget-Windows-v${{ steps.ver.outputs.version }}.exe
          make_latest: true

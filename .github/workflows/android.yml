name: Build Android app

on:
  workflow_dispatch:      # lets you press a "Run workflow" button
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write      # lets the build publish a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read the version number
        id: ver
        working-directory: android
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::Mostafa MultiWidget $VER"
          echo "## Mostafa MultiWidget $VER" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the signing key (the 4 Secrets of the repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=Signing key missing::Add the 4 Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (Settings > Secrets and variables > Actions). See README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the app (version ${{ steps.ver.outputs.version }}), signed with the private key
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the app file
        working-directory: android
        run: cp app/build/outputs/apk/release/*.apk "Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}.apk"

      - name: Keep the app (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}
          path: android/Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}.apk

      - name: Publish a Release (the app's "check for updates" reads it)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mostafa MultiWidget ${{ steps.ver.outputs.version }}
          body_path: android/release-notes.md   # the changes, written in the Release
          files: android/Mostafa-MultiWidget-v${{ steps.ver.outputs.version }}.apk
          make_latest: true

name: Build Windows installer

on:
  workflow_dispatch:      # lets you press a "Run workflow" button
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Building PyInstaller from source failed; using the ready-made one."
            pip install pyinstaller
          }
          pyinstaller --version

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Build the program
        run: >
          pyinstaller --noconfirm --clean --windowed --noupx --name Mostafa-IP-Widget
          --hidden-import psutil
          --icon assets/images/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          --collect-submodules pystray
          main.py

      - name: Check the built program
        shell: pwsh
        run: |
          $env:MYIP_SELFTEST_REPORT = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\Mostafa-IP-Widget\Mostafa-IP-Widget.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $env:MYIP_SELFTEST_REPORT) { Get-Content $env:MYIP_SELFTEST_REPORT }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Keep the installer (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Mostafa-IP-Widget-Setup
          path: installer_output/Mostafa-IP-Widget-Setup.exe

      - name: Publish a release (only when a version tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/Mostafa-IP-Widget-Setup.exe
